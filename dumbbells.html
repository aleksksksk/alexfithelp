<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumbbell Technique</title>
    <link rel="stylesheet" href="../assets/site.css">
</head>
<body style="--accent:#ffd640; --accent-rgb:255,214,64;">
    <main class="site-shell">
        <div class="site-topbar">
            <a class="ghost-btn" href="../index.html" data-i18n="back">Back</a>
            <div class="brand-pill">
                <span class="brand-pill__dot"></span>
                <span data-i18n="brand">Perfect Body Guide</span>
            </div>
            <div class="lang-switch">
                <button type="button" data-set-lang="en">EN</button>
                <button type="button" data-set-lang="ru">RU</button>
            </div>
        </div>

        <section class="hero-panel hero-panel--single">
            <div>
                <div class="eyebrow" data-i18n="eyebrow">Technique library</div>
                <h1 class="hero-title" id="pageTitle">Dumbbell exercises</h1>
                <p class="hero-copy" id="pageIntro"></p>
                <div class="mini-stats" style="margin-top:22px;">
                    <div class="stat-card">
                        <strong id="pageStatA"></strong>
                        <span data-i18n="statACopy">Exercise library</span>
                    </div>
                    <div class="stat-card">
                        <strong id="pageStatB"></strong>
                        <span data-i18n="statBCopy">Interactive layout</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="section-panel">
            <div class="section-head">
                <div>
                    <h2 class="section-title" data-i18n="sectionTitle">Exercise cards</h2>
                    <p class="section-copy" data-i18n="sectionCopy">Filter the library and open each card for the main focus and cue.</p>
                </div>
                <p class="section-note" id="results"></p>
            </div>

            <div class="filter-row" id="filters"></div>
            <div class="exercise-grid" id="cards"></div>
        </section>

        <footer class="site-footer" data-i18n="footer">Switch language any time. Exercise names keep their meaning with dual-language labels.</footer>
    </main>

    <script>
        window.TechniquePageCollection = "dumbbells";
        window.TechniquePageExtraTranslations = {
            statACopy: { en: "Exercise library", ru: "Библиотека упражнений" },
            statBCopy: { en: "Interactive layout", ru: "Интерактивный формат" },
            sectionTitle: { en: "Exercise cards", ru: "Карточки упражнений" },
            sectionCopy: {
                en: "Filter the library and open each card for the main focus and cue.",
                ru: "Фильтруй библиотеку и раскрывай карточки, чтобы быстро увидеть основной акцент и подсказку."
            }
        };
    </script>
    <script src="../assets/site.js"></script>
    <script src="../assets/technique-data.js"></script>
    <script src="../assets/technique-page.js"></script>
    <script>buildTechniquePage();</script>
</body>
</html>
