                <!DOCTYPE html>
                <html lang="ru">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Your guide to the perfect body</title>
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

                        :root {
                            --green: #22ff99;
                        }

                        * {
                            margin: 0;
                            padding: 0;
                            box-sizing: border-box;
                        }

                        body {
                            background: #111111;
                            color: #ffffff;
                            font-family: 'Inter', system-ui, sans-serif;
                            line-height: 1.4;
                            overflow-x: hidden;
                        }

                        /* Верхнее фиксированное меню */
                        .top-nav {
                            position: sticky;
                            top: 0;
                            background: rgba(17, 17, 17, 0.95);
                            backdrop-filter: blur(10px);
                            z-index: 100;
                            padding: 16px 24px;
                            display: flex;
                            justify-content: center;
                            gap: 12px;
                            flex-wrap: wrap;
                            border-bottom: 1px solid rgba(255,255,255,0.08);
                        }

                        .nav-btn {
                            background: var(--green);
                            color: #111111;
                            border: none;
                            padding: 12px 24px;
                            border-radius: 9999px;
                            font-weight: 600;
                            font-size: 14px;
                            cursor: pointer;
                            transition: all 0.3s ease;
                        }

                        .nav-btn.active {
                            background: #111111;
                            color: var(--green);
                            box-shadow: 0 0 0 2px var(--green);
                        }

                        /* Герой */
                        .hero {
                            padding: 60px 24px 20px;
                            text-align: center;
                            max-width: 800px;
                            margin: 0 auto;
                        }

                        .hero h1 {
                            font-size: 42px;
                            font-weight: 600;
                            letter-spacing: -1.5px;
                            margin-bottom: 10px;
                        }

                        .hero p {
                            opacity: 0.7;
                            font-size: 18px;
                        }

                        /* Секции */
                        section {
                            padding: 40px 24px;
                            max-width: 1000px;
                            margin: 0 auto;
                        }

                        /* КОНТЕЙНЕР ДЛЯ КНОПОК НАД КАРТОЧКАМИ — ТЕПЕРЬ ПО ЦЕНТРУ */
                        .section-header-container {
                            display: flex;
                            justify-content: center; /* Центрирование кнопки */
                            margin-bottom: 32px;
                        }

                        .section-header-btn {
                            background: var(--green);
                            color: #111111;
                            font-weight: 600;
                            font-size: 17px;
                            padding: 14px 32px;
                            border-radius: 9999px;
                            border: none;
                            box-shadow: 0 4px 15px rgba(34, 255, 153, 0.3);
                            cursor: pointer;
                        }

                        /* Сетка карточек */
                        .cards-grid {
                            display: grid;
                            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                            gap: 20px;
                        }

                        .card {
                            background: #1a1a1a;
                            border-radius: 24px;
                            padding: 40px 24px;
                            text-align: center;
                            border: 1px solid rgba(255,255,255,0.06);
                            transition: transform 0.3s ease;
                        }

                        .card:hover {
                            transform: translateY(-8px);
                            border-color: var(--green);
                        }

                        .card-icon {
                            font-size: 50px;
                            margin-bottom: 20px;
                            display: flex;
                            justify-content: center;
                        }

                        footer {
                            padding: 60px 24px;
                            text-align: center;
                            opacity: 0.4;
                            font-size: 13px;
                        }

                        @media (max-width: 600px) {
                            .hero h1 { font-size: 32px; }
                            .cards-grid { grid-template-columns: 1fr; }
                        }
                    </style>
                </head>
                <body>

                    <div class="top-nav">
                        <button class="nav-btn active" onclick="scrollToSection('section-0')">Exercise Technique</button>
                        <button class="nav-btn" onclick="scrollToSection('section-1')">Nutrition</button>
                        <button class="nav-btn" onclick="scrollToSection('section-2')">Workout Plan</button>
                    </div>

                    <div class="hero">
                        <h1>Your guide to the perfect body</h1>
                        <p>Train smarter, eat better, become stronger</p>
                    </div>

                    <section id="section-0">
                        <div class="section-header-container">
                            <button class="section-header-btn">Exercise Technique</button>
                        </div>
                        <div class="cards-grid">
                            <div class="card">
                                <div class="card-icon">
                                    <svg width="60" height="60" viewBox="0 0 100 100">
                                        <rect x="10" y="40" width="20" height="20" rx="4" fill="#22ff99" />
                                        <rect x="70" y="40" width="20" height="20" rx="4" fill="#22ff99" />
                                        <rect x="30" y="45" width="40" height="10" fill="white" />
                                    </svg>
                                </div>
                                <h3>Dumbbells</h3>
                            </div>
                            <div class="card">
                                <div class="card-icon">⚙️</div>
                                <h3>Cable Machines</h3>
                            </div>
                            <div class="card">
                                <div class="card-icon">🏋️‍♂️</div>
                                <h3>Barbells</h3>
                            </div>
                        </div>
                    </section>

                    <section id="section-1">
                        <div class="section-header-container">
                            <button class="section-header-btn">Nutrition</button>
                        </div>

                        <div class="cards-grid">

                            <div class="card" onclick="goToPage('nutrition.html#bulking')">
                                <div class="card-icon">🥩</div>
                                <h3>Build Muscle</h3>
                            </div>

                            <div class="card" onclick="goToPage('nutrition.html#cutting')">
                                <div class="card-icon">🔥</div>
                                <h3>Cut Fat</h3>
                            </div>

                            <div class="card" onclick="goToPage('nutrition.html#weightloss')">
                                <div class="card-icon">🥗</div>
                                <h3>Lose Weight</h3>
                            </div>

                        </div>
                    </section>

                    <section id="section-2">
                        <div class="section-header-container">
                            <button class="section-header-btn">Workout Plan</button>
                        </div>
                        <div class="cards-grid">
                            <div class="card" onclick="goToPage('workout.html#bodybuilding')">
                                <div class="card-icon">🏆</div>
                                <h3>Bodybuilding</h3>
                            </div>

                            <div class="card" onclick="goToPage('cardio.html#cardio')">
                                <div class="card-icon">🏃</div>
                                <h3>Cardio</h3>
                            </div>

                            <div class="card" onclick="goToPage('powerlifting.html#powerlifting')">
                                <div class="card-icon">⚡</div>
                                <h3>Powerlifting</h3>
                            </div>
                        </div>
                    </section>

                    <footer>
                        © 2026 Perfect Body Guide • All rights reserved
                    </footer>

                    <script>
                        function scrollToSection(id) {
                            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });

                            // Обновление активной кнопки в меню
                            document.querySelectorAll('.nav-btn').forEach(btn => {
                                btn.classList.remove('active');
                                if (btn.getAttribute('onclick').includes(id)) btn.classList.add('active');
                            });
                        }
                    </script>
                    <script>
                        function goToPage(page) {
                            window.location.href = page;
                        }
                    </script>
                </body>
                </html>
